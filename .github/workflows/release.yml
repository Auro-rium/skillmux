name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-latest }
          - { os: darwin, arch: amd64, runner: macos-latest }
          - { os: darwin, arch: arm64, runner: macos-latest }
          - { os: windows, arch: amd64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Build
        shell: bash
        run: |
          set -eu
          VERSION="$GITHUB_REF_NAME"
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            GOOS=windows GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/skillmux.exe ./cmd/skillmux
            cd dist && 7z a "skillmux_windows_${{ matrix.arch }}.zip" skillmux.exe
          else
            GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o dist/skillmux ./cmd/skillmux
            tar -C dist -czf "dist/skillmux_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" skillmux
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: skillmux-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/skillmux_*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

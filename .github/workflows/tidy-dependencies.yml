name: tidy-dependencies

on:
  push:
    branches:
      - feat/complete-tui-visual-system
    paths:
      - go.mod
      - internal/ui/**
      - .github/workflows/tidy-dependencies.yml

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-tui-visual-system
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Resolve Go module checksums
        run: go mod tidy
      - name: Commit go.sum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "skillmux-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: lock TUI dependencies"
          git push origin HEAD:feat/complete-tui-visual-system
